# closed LilScript world — extern class keys may mangle
[javascript]
priority = "size-first"
optimization_level = 13
cost_model = "brotli"
assume_pristine_builtins = false
strip_console = true
local_name_reserve = 48
candidate_search = "production"
function_spelling = "function"
public_aggregate_abi = "named"

[mangle]
identifiers = true
properties = true
exports = false
extern_fields = false
pool_strings = true
