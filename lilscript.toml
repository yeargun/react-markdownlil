# reusable ESM — host-visible names stay
[javascript]
assume_pure_property_reads = true
# micromark's state functions and this layer's callbacks are called, never
# constructed; React reads a component's prototype only to test for a class,
# which an arrow answers the same way. Measured (b79): -146 Brotli.
assume_unconstructed_callbacks = true
priority = "size-first"
optimization_level = 13
cost_model = "brotli"
# The graph and this layer call standard builtins the way upstream does; an
# environment that replaces them breaks upstream too. Measured on the browser
# build (b79): 29,681 -> 27,394 Brotli.
assume_pristine_builtins = true
strip_console = true
candidate_search = "production"

[mangle]
identifiers = true
properties = true
pool_strings = true
